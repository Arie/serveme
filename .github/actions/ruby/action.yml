name: Setup Ruby
description: Install Ruby from .tool-versions and install gems with bundler caching

runs:
  using: composite
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: .tool-versions
        bundler-cache: true
