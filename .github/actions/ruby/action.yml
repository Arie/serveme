name: Setup Ruby
description: Install Ruby from .tool-versions and install gems with bundler caching

runs:
  using: composite
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
      with:
        ruby-version: .tool-versions
        bundler-cache: true
