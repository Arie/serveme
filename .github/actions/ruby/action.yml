name: Setup Ruby
description: Install Ruby from .tool-versions and install gems with bundler caching

runs:
  using: composite
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: .tool-versions
        bundler-cache: true
