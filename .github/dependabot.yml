version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Monthly + grouped into a single
  # PR to stay quiet; covers both .github/workflows and the .github/actions
  # composite action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
    open-pull-requests-limit: 5

  # Gems are updated by hand; a limit of 0 disables version-update PRs but
  # keeps Dependabot security-update PRs for advisories against Gemfile.lock.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
