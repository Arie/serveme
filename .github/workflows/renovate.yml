name: Renovate

# Self-hosted so the RBI workflow can commit to Renovate's branches as the same
# App, which Renovate's gitIgnoredAuthors then ignores. The repository config is
# .github/renovate.json5, the administrator config .github/renovate-global.json5.
on:
  schedule:
    - cron: "41 */2 * * *"
  # A tick on the Dependency Dashboard.
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [debug, info]
        default: debug

concurrency:
  group: renovate
  cancel-in-progress: false
  queue: max

jobs:
  renovate:
    name: Renovate
    # Renovate rewrites the dashboard itself at the end of every run.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' &&
      github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The App, not GITHUB_TOKEN, so its pull requests trigger CI.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Restore repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repository-${{ github.run_id }}
          restore-keys: renovate-repository-
      # Renovate runs as uid 12021 in its container.
      - name: Hand the cache to Renovate
        run: |
          if [ -d /tmp/renovate ]; then
            sudo chown -R 12021:0 /tmp/renovate
          fi

      - name: Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'debug' }}
        with:
          renovate-version: 44.119.1
          configurationFile: .github/renovate-global.json5
          token: ${{ steps.app-token.outputs.token }}

      - name: Save repository cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repository-${{ github.run_id }}
